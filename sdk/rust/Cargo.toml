[package]
name = "mpp-rs"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for stealth address confidential payments on Tempo blockchain"

[dependencies]
k256 = { version = "0.13", features = ["ecdh", "arithmetic"] }
sha3 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
thiserror = "1"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
